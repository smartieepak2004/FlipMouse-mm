name: Build FlipMouse
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: pip install meson ninja

      - name: Get libevdev
        run: git clone --depth 1 --branch libevdev-1.13.1 https://gitlab.freedesktop.org/libevdev/libevdev.git

      - name: Build libevdev for the phone
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cat > cross.txt <<EOF
          [binaries]
          c = '$TC/armv7a-linux-androideabi30-clang'
          ar = '$TC/llvm-ar'
          strip = '$TC/llvm-strip'
          [host_machine]
          system = 'linux'
          cpu_family = 'arm'
          cpu = 'armv7'
          endian = 'little'
          EOF
          sed -i "s/cc\.find_library('rt'[^)]*)/dependency('', required: false)/" libevdev/meson.build
          grep -n "find_library" libevdev/meson.build
          meson setup build-evdev libevdev --cross-file cross.txt --default-library=static -Dtests=disabled -Ddocumentation=disabled
          ninja -C build-evdev

      - name: Build mouse
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          LIB=$(find build-evdev -name 'libevdev.a' | head -1)
          "$TC/armv7a-linux-androideabi30-clang" -O2 main.c -I libevdev "$LIB" -o mouse
          "$TC/llvm-strip" mouse
          file mouse

      - name: Package Magisk module
        run: |
          mkdir -p module/META-INF/com/google/android
          cp mouse module/mouse
          curl -fsSL -o module/META-INF/com/google/android/update-binary https://raw.githubusercontent.com/topjohnwu/Magisk/v27.0/scripts/module_installer.sh
          echo "#MAGISK" > module/META-INF/com/google/android/updater-script
          cat > module/module.prop <<'EOF'
          id=FlipMouse
          name=FlipMouse
          version=1.1
          versionCode=2
          author=FlipMouse
          description=Virtual mouse for TCL Flip 2
          EOF
          cat > module/service.sh <<'EOF'
          #!/system/bin/sh
          MODDIR=${0%/*}
          chmod 755 "$MODDIR/mouse"
          until [ "$(getprop sys.boot_completed)" = "1" ]; do sleep 2; done
          "$MODDIR/mouse" &
          EOF
          cat > module/customize.sh <<'EOF'
          set_permissions() {
            set_perm_recursive $MODPATH 0 0 0755 0644
            set_perm $MODPATH/mouse 0 0 0755
            set_perm $MODPATH/service.sh 0 0 0755
          }
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: FlipMouse
          path: module/
